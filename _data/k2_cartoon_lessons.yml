- number: "01"
  title: 認識 AI
  summary: 從生活物件、規律與分類遊戲，認識 AI 是人製作的技術，也知道結果需要確認。
  focus: 看資訊、說理由、再確認
- number: "02"
  title: 人、機器與 AI
  summary: 讀線索、分圖卡，理解會自己動不等於 AI；資訊不夠時，先問功能與運作方式。
  focus: 自動化不等於 AI
- number: "03"
  title: 規律小偵探
  summary: 用水果規律、天氣與生活反例，練習先留下預測，再依新線索核對與修正。
  focus: 預測有理由，也可能錯
- number: "04"
  title: 教教機器人
  summary: 比較不同動物例子、找出錯誤標籤，並用未見過的新卡確認分類方法。
  focus: 例子要正確、相關、多樣
