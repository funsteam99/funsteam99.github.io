{% assign comic = site.data.comic_panels[include.id] %}
<section class="panel-reader" aria-label="{{ comic.title | escape }}分格閱讀">
  <p class="panel-reader__intro">往下滑，依序閱讀。點選圖片可放大。</p>
  {% for item in comic.items %}
  {% if item.section_heading %}<h2 id="{{ item.section_id | escape }}" class="panel-reader__language" lang="{{ item.language | escape }}">{{ item.section_heading | escape }}</h2>{% endif %}
  <figure class="panel-reader__item{% if item.kind == 'header' %} panel-reader__header{% endif %}"{% if item.language %} lang="{{ item.language | escape }}"{% endif %}>
    {% if item.show_number %}<figcaption class="panel-reader__number">{{ item.number }}</figcaption>{% endif %}
    <a href="{{ item.png | relative_url }}" target="_blank" rel="noopener" aria-label="放大：{{ item.alt | escape }}">
      <picture><source srcset="{{ item.webp | relative_url }} {{ item.width }}w" sizes="(max-width: 704px) calc(100vw - 24px), 680px" type="image/webp"><img src="{{ item.png | relative_url }}" width="{{ item.width }}" height="{{ item.height }}" alt="{{ item.alt | escape }}" loading="{% if forloop.first %}eager{% else %}lazy{% endif %}" decoding="async"></picture>
    </a>
    {% if item.transcript %}<details class="panel-reader__transcript"><summary>{% if item.language == 'ja' %}このページの文字{% else %}本頁文字{% endif %}</summary><p>{{ item.transcript | escape | newline_to_br }}</p></details>{% endif %}
  </figure>
  {% endfor %}
  <p class="panel-reader__original"><a href="{{ comic.source | relative_url }}" target="_blank" rel="noopener">{{ comic.source_label | default: '查看完整原圖' | escape }}</a></p>
</section>
