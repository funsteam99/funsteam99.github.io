{%- assign variants = site.data.image_variants[include.src] -%}
{%- if variants -%}
<source type="image/webp" srcset="{%- for variant in variants.variants -%}{{ variant.url | relative_url | uri_escape }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{%- endfor -%}" sizes="{{ include.sizes | default: '(max-width: 768px) 100vw, 1200px' }}">
{%- endif -%}
